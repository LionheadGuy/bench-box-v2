<text x="24.0" y="707.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Notes</text>
<text x="34.0" y="725.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- The H5 is the only feed into the car&#x27;s stereo; in the box, LINE OUT is for bench headphones.</text>
<text x="34.0" y="743.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Panel socket holes (6.5 mm) are placeholders until the sockets are bought.</text>
<text x="34.0" y="761.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Pins in the boxes: module / connector pin where known (TBD = not assigned). Join pins (S5-3, D-FL-12 ...) are the same number on both harnesses.</text>
<text x="34.0" y="779.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Colour codes: base/stripe (BK black, RD red, OR orange, YE yellow, GN green, BU blue, VT violet, GY grey, WH white, BN brown sensor ground, PK pink, TN tan, LB / LG light blue / green). Dashed grey = off-the-shelf cable.</text>
