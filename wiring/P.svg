<line x1="274" y1="813.0" x2="824" y2="813.0" stroke="#333" stroke-width="5.5"/><line x1="274" y1="813.0" x2="824" y2="813.0" stroke="#1b1b1b" stroke-width="4"/><line x1="274" y1="813.0" x2="824" y2="813.0" stroke="#2e9d4a" stroke-width="2" stroke-dasharray="6 6"/>
<text x="282.0" y="808.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#222">P-014  H5 FEED -   16 AWG   BK/GN</text>
<text x="268.0" y="817.0" font-size="10" text-anchor="end" font-weight="normal" fill="#1f3a5f">J3 XT30</text>
<text x="24.0" y="853.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Notes</text>
<text x="34.0" y="871.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- XT30s: + is the square end of the housing (pin 2 on both our boards). Meter every lead before the first plug-in.</text>
<text x="34.0" y="889.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- The pack is the only path for current when unplugged: charger board BATFET -&gt; SYS. Switch-over not tested.</text>
<text x="34.0" y="907.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Wire gauges are PROPOSED from the fuses: 10 A on the pack side, 5 A to the hub, 10 A to the TRACO.</text>
<text x="34.0" y="925.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Pins in the boxes: module / connector pin where known (TBD = not assigned). Join pins (S5-3, D-FL-12 ...) are the same number on both harnesses.</text>
<text x="34.0" y="943.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Colour codes: base/stripe (BK black, RD red, OR orange, YE yellow, GN green, BU blue, VT violet, GY grey, WH white, BN brown sensor ground, PK pink, TN tan, LB / LG light blue / green). Dashed grey = off-the-shelf cable.</text>
</svg>