<text x="282.0" y="714.0" font-size="10.5" text-anchor="start" font-weight="normal" fill="#222">D-019  +5V PIGTAIL (pin 2) TO THE 5 V SPLICE   22 AWG   RD</text>
<text x="816.0" y="714.0" font-size="10" text-anchor="end" font-weight="normal" fill="#666" font-style="italic">ONE crimp in pin 2; the Stream Deck, BMS adapter, BT board and button LED reds soldered to it, heat-shrunk</text>
<text x="268.0" y="723.0" font-size="10" text-anchor="end" font-weight="normal" fill="#1f3a5f">pin 2</text>
<text x="1088.0" y="723.0" font-size="10" text-anchor="end" font-weight="normal" fill="#1f3a5f">5 V splice</text>
<text x="24.0" y="759.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Notes</text>
<text x="34.0" y="777.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- ALL header leads end in ONE 2 x 12 Dupont housing over the whole header, so it goes on and off as one plug. Each device has its OWN ground pin: 1 button LED, 6 Stream Deck, 11 BMS adapter, 16 power button, 19 Bluetooth. Left empty: 4 (3.3 V), 8/10/12/14 (UART), 13/15/18/20 (I2C), 22 (CEC), 24 (standby 5 V).</text>
<text x="34.0" y="795.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- The housing fits either way round: mark pin 1 on the housing and beside the header. Turned 180 deg, the 5 V on pin 2 lands on pin 23 (P6 D-).</text>
<text x="34.0" y="813.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Header pin 2 (+5 V, on only while the H5 runs) feeds the Stream Deck, the button LED, the BMS adapter and the BT board: how much it can give is UNCHECKED.</text>
<text x="34.0" y="831.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Not pin 24 (standby 5 V): it would drain the pack with the H5 off.</text>
<text x="34.0" y="849.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Pins in the boxes: module / connector pin where known (TBD = not assigned). Join pins (S5-3, D-FL-12 ...) are the same number on both harnesses.</text>
<text x="34.0" y="867.0" font-size="11" text-anchor="start" font-weight="normal" fill="#333">- Colour codes: base/stripe (BK black, RD red, OR orange, YE yellow, GN green, BU blue, VT violet, GY grey, WH white, BN brown sensor ground, PK pink, TN tan, LB / LG light blue / green). Dashed grey = off-the-shelf cable.</text>
</svg>